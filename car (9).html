<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#05060d;color:#e8f0ff;font-family:system-ui,Segoe UI,Tahoma,sans-serif}
canvas#gl{position:fixed;inset:0;width:100%;height:100%}
.hide{display:none!important}
.btn{background:#0b1226;color:#7ff;border:2px solid #0ff;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer;text-shadow:0 0 8px #0ff;box-shadow:0 0 14px #0ff4,inset 0 0 10px #0ff2;transition:.15s}
.btn:hover{background:#0ff;color:#012}
.btn.big{font-size:26px;padding:16px 60px}
.btn.pink{border-color:#f0f;color:#f9f;box-shadow:0 0 14px #f0f4}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:5}
.panel{background:#070b18ee;border:1px solid #0ff8;border-radius:14px;padding:20px;width:min(560px,94vw);max-height:90vh;overflow:auto;box-shadow:0 0 30px #0ff3;display:flex;flex-direction:column;gap:10px}
h1{margin:0 0 10px;font-size:clamp(32px,7vw,64px);letter-spacing:4px;color:#0ff;text-shadow:0 0 20px #0ff,0 0 40px #f0f}
h3{margin:0;color:#0ff}
input,select{background:#0b1226;color:#fff;border:1px solid #0ff8;border-radius:8px;padding:9px;font-size:15px;width:100%}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
label input[type=checkbox]{width:22px;height:22px}label input[type=range]{width:55%}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:9;pointer-events:none}
#top>*{pointer-events:auto}#top select{width:auto}
#fps{background:#000a;border:1px solid #0f8;color:#0f8;padding:4px 10px;border-radius:8px;font:12px monospace}
.room{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid #0ff4;border-radius:8px;cursor:pointer}
.room:hover{background:#0ff2}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
#hud{position:fixed;inset:0;pointer-events:none;z-index:4}
#spd{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);text-align:center;font:700 44px monospace;color:#0ff;text-shadow:0 0 12px #0ff}
#spd small{font-size:14px;display:block}
#nbar{width:200px;height:12px;border:1px solid #f0f;border-radius:6px;margin:4px auto 0;overflow:hidden}
#nfill{height:100%;width:100%;background:linear-gradient(90deg,#f0f,#0ff)}
#lap{position:absolute;top:44px;left:50%;transform:translateX(-50%);font:700 26px monospace;color:#ff0;text-shadow:0 0 10px #ff0}
#board{position:absolute;top:44px;left:8px;background:#000a;border:1px solid #0ff6;border-radius:8px;padding:6px 10px;font:13px monospace;min-width:150px}
#mm{position:absolute;top:44px;right:8px;width:140px;height:140px;background:#000a;border:1px solid #0ff6;border-radius:8px}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 140px monospace;color:#ff0;text-shadow:0 0 30px #f80}
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
#touch .t{position:absolute;pointer-events:auto;background:#0ff2;border:2px solid #0ff;border-radius:50%;color:#0ff;display:flex;align-items:center;justify-content:center;font-weight:700;touch-action:none}
.t:active,.t.on{background:#0ffa;color:#000}
[dir=rtl] #board{left:auto;right:8px}[dir=rtl] #mm{right:auto;left:8px}
#top{direction:ltr}.grp{display:flex;gap:6px;align-items:center}
.ib{background:#0b1226;color:#0ff;border:1px solid #0ff;border-radius:8px;width:38px;height:34px;font-size:18px;cursor:pointer;box-shadow:0 0 8px #0ff4}
.ib:hover{background:#0ff;color:#012}
html{overflow:hidden}html.rot body{position:absolute;left:100vw;top:0;width:100vh;height:100vw;transform:rotate(90deg);transform-origin:0 0}
body{font-family:Cairo,system-ui,Segoe UI,Tahoma,sans-serif}option{background:#0b1226;color:#fff}
.btn{background:linear-gradient(#0d2a78,#07143a);color:#fff;border:2px solid #3aa0ff;text-shadow:0 0 8px #3aa0ff;box-shadow:0 0 14px #3aa0ff55,inset 0 0 10px #3aa0ff33}
.btn:hover{background:#3aa0ff;color:#012}.btn.pink{border-color:#a45cff;box-shadow:0 0 14px #a45cff66;background:linear-gradient(#4a1c9a,#1e0a4a)}.btn.pink:hover{background:#a45cff}
.panel,.gp{background:linear-gradient(#070b18f2,#070b18f2) padding-box,linear-gradient(135deg,#00e5ff,#7a3cff,#1e90ff) border-box;border:2px solid transparent;border-radius:18px;box-shadow:0 0 34px #3a5cff66;width:min(560px,94vw);max-height:92vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.gh{display:flex;align-items:center;gap:12px;padding-bottom:8px;border-bottom:1px solid #2b6bff55}.gh h2{margin:0;flex:1;font:400 28px "Russo One",Cairo,sans-serif;color:#fff;text-shadow:0 0 12px #6a5cff}.gi{font-size:32px;filter:drop-shadow(0 0 6px #6a8cff)}.gc{font-size:26px;color:#9ac}
.gp h3{margin:2px 0;color:#7fc4ff;font-size:17px}
.fld{display:flex;align-items:center;gap:10px;border:1px solid #2b6bff;border-radius:10px;background:#06102c;padding:0 12px;height:46px;flex:1}.fld input,.fld select{background:transparent;border:0;outline:0;color:#fff;padding:0;height:100%;font-size:15px}.fld i{font-style:normal;color:#6aa8ff}
.fl{display:flex;align-items:center;justify-content:space-between;gap:10px}.fl b{white-space:nowrap;font-weight:600;color:#cfe3ff;font-size:14px}.row2{display:flex;gap:10px;flex-wrap:wrap}.row2 .fl{flex:1;min-width:200px}
.room{border-color:#2b6bff88}.room:hover{background:#2b6bff33}
#fps{background:#0a1230cc;border:1px solid #3a7bff;color:#cfe3ff;border-radius:10px;padding:6px 12px}
.ib,#top select{border-color:#3a7bff;background:#0a1230cc;color:#cfe3ff;border-radius:10px}
#menu{align-items:flex-end;justify-content:center;padding-right:5vw;direction:ltr}
#logo{position:absolute;left:4vw;top:4vh;pointer-events:none}
#logo b{display:block;font:400 clamp(44px,10vw,130px)/1 "Russo One",Impact,sans-serif;font-style:italic;transform:skewX(-8deg);color:#fff;letter-spacing:2px;text-shadow:0 0 18px #1e90ff,0 5px 0 #0a2a6a;animation:fl 3.2s ease-in-out infinite,gl 6s infinite}
#logo b i{font-style:inherit;background:linear-gradient(90deg,#1e90ff,#00e5ff,#1e90ff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:sh 2.2s linear infinite;filter:drop-shadow(0 0 12px #1e90ff)}
#logo .crown{display:block;margin-left:22%;animation:fl 2.4s ease-in-out infinite;filter:drop-shadow(0 0 8px #1e90ff)}
#logo .flag{height:16px;width:60%;margin-top:8px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/16px 16px;transform:skewX(-20deg);opacity:.9;animation:fg 1s linear infinite}
@keyframes fl{50%{translate:0 -10px}}@keyframes sh{to{background-position:-200% 0}}@keyframes fg{to{background-position:32px 0}}
@keyframes gl{0%,92%,100%{filter:none}94%{filter:hue-rotate(40deg) brightness(1.4);translate:4px 0}96%{translate:-4px 0}}
@keyframes inb{from{opacity:0;transform:translateX(70px)}}
.mbs{display:flex;flex-direction:column;gap:12px;align-items:flex-end;filter:drop-shadow(0 0 10px #1e90ff88)}
.mb{border:0;padding:2px;width:min(330px,78vw);height:56px;cursor:pointer;background:#27b6ff;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);transition:.18s;animation:inb .5s both}
.mb:nth-child(2){animation-delay:.1s}.mb:nth-child(3){animation-delay:.2s}.mb:nth-child(4){animation-delay:.3s}
.mb span{display:flex;align-items:center;gap:14px;height:100%;padding:0 22px;color:#fff;font:400 20px "Russo One",Cairo,sans-serif;letter-spacing:1px;text-transform:uppercase;background:linear-gradient(100deg,#08184a,#0a2f8f 55%,#08205f);clip-path:polygon(13px 0,100% 0,calc(100% - 13px) 100%,0 100%)}
.mb em{font-style:normal;width:34px;text-align:center;font-size:22px}.mb u{text-decoration:none}
.mb.main{height:68px;width:min(380px,82vw)}.mb.main span{background:linear-gradient(100deg,#0a3cc9,#1e90ff 60%,#0a46d6);font-size:28px}
.mb:hover{transform:translateX(-10px);background:#aff}.mb:hover span{background:linear-gradient(100deg,#0f3fd0,#2aa4ff)}
#tag{position:absolute;left:3vw;bottom:3vh;font:italic 400 18px "Russo One",sans-serif;color:#cfe3ff;text-shadow:0 0 8px #1e90ff;pointer-events:none}
#carm{justify-content:flex-end;padding-bottom:3vh}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#234;margin:0 3px}.dot.on{background:#0ff;box-shadow:0 0 8px #0ff}
@media(max-width:700px){#menu{align-items:center;justify-content:flex-end;padding:0 0 6vh}#logo{left:0;right:0;text-align:center}#logo .crown{margin:0 auto}#logo .flag{margin:8px auto 0}.mbs{align-items:center}.mb{height:48px}.mb.main{height:58px}#tag{display:none}}
#brand{position:absolute;top:2.5vh;left:50%;translate:-50% 0;width:min(920px,96vw);text-align:center;pointer-events:none}
#brand .bolts{position:absolute;left:0;top:22%;width:100%;height:78%;animation:bz 2.6s infinite}
#brand .crown{display:block;margin:0 auto -4px;width:clamp(36px,6vw,64px);filter:drop-shadow(0 0 8px #27b6ff);animation:fl 2.4s ease-in-out infinite;position:relative}
#brand .bt{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.5vw,18px)}
#brand b{font:400 clamp(34px,8.5vw,104px)/1 "Russo One",Impact,sans-serif;font-style:italic;background:linear-gradient(#fff 25%,#8fd0ff 55%,#3a7bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #5a3cff) drop-shadow(0 4px 0 #14146a);transform:skewX(-8deg);animation:fl 3s ease-in-out infinite,gp 2.5s ease-in-out infinite;letter-spacing:1px}
#brand .flg{width:clamp(26px,5vw,56px);height:clamp(26px,5vw,56px);background:repeating-conic-gradient(#fff 0 25%,#0a0a18 0 50%) 0 0/calc(clamp(26px,5vw,56px)/3) calc(clamp(26px,5vw,56px)/3);transform:rotate(-14deg) skewX(-6deg);border:1px solid #9ff;box-shadow:0 0 12px #4af}
#brand .flg.r{transform:rotate(14deg) skewX(6deg)}
@keyframes bz{0%,100%{opacity:1}45%{opacity:.55}50%{opacity:1}55%{opacity:.6}}@keyframes gp{50%{filter:drop-shadow(0 0 28px #7a5cff) drop-shadow(0 4px 0 #14146a)}}
#menu{align-items:center;justify-content:flex-end;padding:0 0 8vh}.mbs{align-items:center}
.mb{background:linear-gradient(90deg,#3aa0ff,#a45cff)}
.mb.main{background:linear-gradient(90deg,#c89bff,#5a7bff);width:min(420px,84vw)}.mb.main span{background:linear-gradient(100deg,#4b25c7,#7a3cff 55%,#3b2bd6)}
#modes{gap:16px;direction:ltr}.mt{font:400 clamp(24px,4vw,38px) "Russo One",Cairo,sans-serif;color:#fff;text-shadow:0 0 14px #5a3cff;margin:0}
.mrow{display:flex;gap:clamp(10px,2vw,24px);flex-wrap:wrap;justify-content:center}
.mode{border:0;padding:3px;width:min(240px,28vw);min-width:150px;height:clamp(130px,22vh,190px);cursor:pointer;background:linear-gradient(#c89bff,#27b6ff);clip-path:polygon(20px 0,100% 0,calc(100% - 20px) 100%,0 100%);transition:.18s;filter:drop-shadow(0 0 10px #6a8cff)}
.mode span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:100%;background:linear-gradient(160deg,#101a58,#2b1a78 60%,#0a1f6a);clip-path:polygon(18px 0,100% 0,calc(100% - 18px) 100%,0 100%)}
.mode b{font:italic 400 clamp(36px,6vw,64px) "Russo One",sans-serif;color:#fff;text-shadow:0 0 16px #6a8cff}.mode small{color:#bcd;font-weight:700;letter-spacing:1px}
.mode:hover{transform:translateY(-8px) scale(1.05);background:#fff}.mode:hover span{background:linear-gradient(160deg,#1a2a8a,#4a2aa8 60%,#1a3a9a)}
#stage{justify-content:flex-end;align-items:center;padding-bottom:4vh;pointer-events:none;direction:ltr}#stage>*{pointer-events:auto}
#slp{position:absolute;left:1.5vw;top:11vh;width:min(390px,44vw);background:linear-gradient(#070b18ee,#070b18ee) padding-box,linear-gradient(160deg,#27b6ff,#7a3cff) border-box;border:2px solid transparent;border-radius:14px;padding:10px 12px;box-shadow:0 0 28px #5a3cff66}
#sh{font:italic 400 28px "Russo One",sans-serif;color:#fff;text-shadow:0 0 12px #6a5cff;margin:0 0 4px 4px}
.sr{display:flex;align-items:center;gap:12px;height:46px;margin:6px 0;padding:0 12px 0 8px;border-radius:8px;background:linear-gradient(90deg,#0b1230,#090e24);border-left:5px solid #2aa4ff}
.sr.b{border-left-color:#a45cff}.sr.me{background:linear-gradient(90deg,#14246e,#1a1458);box-shadow:inset 0 0 14px #5a7bff66}
.sr b{font:italic 400 26px "Russo One",sans-serif;color:#5d86ff;width:34px;text-align:center}.sr .nm{flex:1;color:#fff;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sr .nm i{font-style:normal;margin-right:8px}.sr em{color:#7ff;font-style:normal;font-size:20px}
#sbtn{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}#swait{position:absolute;bottom:calc(4vh + 100px);left:50%;translate:-50% 0;color:#cfe3ff;font-weight:700;text-shadow:0 0 8px #5a3cff}
@media(max-width:700px){#slp{top:9vh;width:62vw;padding:6px 8px}.sr{height:34px;margin:4px 0}.sr b{font-size:18px}#sh{font-size:20px}}
input{user-select:text;-webkit-user-select:text}
#auth{z-index:7;background:radial-gradient(circle at 50% 30%,#1a1f5acc,#05060df2)}
.err{color:#ff7a8a;font-size:13px;min-height:18px;text-align:center;font-weight:700}
#who{display:flex;align-items:center;height:34px;max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 14px Cairo,system-ui,sans-serif;color:#cfe3ff;background:#0a1230cc;border:1px solid #3a7bff;border-radius:10px;padding:0 12px}
.cstack{display:flex;flex-direction:column;gap:10px;align-items:stretch}
#rb{position:absolute;top:16%;left:50%;transform:translateX(-50%);width:min(440px,92vw);background:linear-gradient(#070b18f2,#070b18f2) padding-box,linear-gradient(135deg,#00e5ff,#7a3cff) border-box;border:2px solid transparent;border-radius:16px;padding:12px 14px;box-shadow:0 0 30px #5a3cff77;text-align:center}
#rb .rt{font:400 22px "Russo One",Cairo,sans-serif;color:#fff;margin-bottom:6px;text-shadow:0 0 10px #6a5cff}
#rb .rn{margin-top:8px;color:#ffe14d;font-weight:800}
#rb .sr{text-align:start}#rb .sr em{font-size:14px}
@media(max-height:480px){#menu{padding-bottom:2vh}.mbs{gap:6px}.mb{height:38px}.mb.main{height:46px}.mb span{font-size:15px}.mb.main span{font-size:20px}}
</style></head><body>
<canvas id="gl"></canvas>
<div id="top"><div id="fps">FPS</div><div class="grp"><span id="who" class="hide"></span><select id="lang"><option value="en">English</option><option value="ar">العربية</option></select><button class="ib" id="bFs" title="Fullscreen">⛶</button><button class="ib" id="bFlip" title="Rotate screen">⟳</button></div></div>

<div id="menu" class="ov">
 <div id="brand"><svg class="bolts" viewBox="0 0 1000 200" preserveAspectRatio="none"><polygon points="0,120 150,40 120,90 300,20 210,100 380,60 240,150 80,170" fill="#6a3cff" opacity=".85"/><polygon points="1000,120 850,40 880,90 700,20 790,100 620,60 760,150 920,170" fill="#6a3cff" opacity=".85"/><polygon points="40,140 190,70 160,110 330,50 250,120 120,170" fill="#27b6ff" opacity=".9"/><polygon points="960,140 810,70 840,110 670,50 750,120 880,170" fill="#27b6ff" opacity=".9"/></svg>
  <svg class="crown" viewBox="0 0 64 40"><path d="M4 36L10 8l14 14L32 2l8 20 14-14 6 28z" fill="#1e90ff" stroke="#9ff" stroke-width="2"/></svg>
  <div class="bt"><span class="flg"></span><b>RACE-CRAZY</b><span class="flg r"></span></div></div>
 <div class="mbs">
  <button class="mb main" id="bPlay"><span><em>▶</em><u data-i="play"></u></span></button>
  <button class="mb" id="bSet"><span><em>⚙</em><u data-i="settings"></u></span></button>
  <button class="mb" id="bCtl"><span><em>🎮</em><u id="ctlt"></u></span></button>
  <button class="mb" id="bCar"><span><em>🚗</em><u data-i="changecar"></u></span></button>
 </div>
</div>
<div id="modes" class="ov hide">
 <h2 class="mt" data-i="choose"></h2>
 <div class="mrow">
  <button class="mode" data-n="1"><span><b>1V1</b><small data-i="p2"></small></span></button>
  <button class="mode" data-n="2"><span><b>2V2</b><small data-i="p4"></small></span></button>
  <button class="mode" data-n="3"><span><b>3V3</b><small data-i="p6"></small></span></button>
 </div>
 <div class="row" style="max-width:420px"><button class="btn" id="bMBack">↩ <span data-i="back"></span></button><button class="btn pink" id="bRooms">🏠 <span data-i="rooms2"></span></button></div>
</div>
<div id="stage" class="ov hide">
 <div id="slp"><div id="sh"></div><div id="slots"></div></div>
 <div id="swait"></div>
 <div id="sbtn"><button class="mb main" id="sgo"><span><em>▶</em><u data-i="start"></u></span></button><button class="btn" id="sleave">↩ <span data-i="leave"></span></button></div>
</div>
<div id="rooms" class="ov hide"><div class="gp">
 <div class="gh"><span class="gi">🎮</span><h2 data-i="gtitle"></h2><span class="gc">♛</span></div>
 <h3>👥 <span data-i="rooms"></span></h3><div id="rlist"></div>
 <div id="fbwarn" class="hide" style="color:#fa0;font-size:13px"></div>
 <h3>✎ <span data-i="create"></span></h3>
 <div class="fld"><i>👤</i><input id="pn" data-p="pname"></div>
 <div class="fld"><i>👥</i><input id="rn" data-p="rname"></div>
 <div class="fld"><i>⚙</i><input id="rp" data-p="pass" type="password"></div>
 <label class="fl"><b>🗺 <span data-i="map"></span></b><span class="fld"><select id="rmap"></select></span></label>
 <div class="row2"><label class="fl"><b>🔁 <span data-i="laps"></span></b><span class="fld"><select id="rl"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></span></label>
 <label class="fl"><b>👥 <span data-i="max"></span></b><span class="fld"><select id="rm"></select></span></label></div>
 <div class="row"><button class="btn" id="bBack1">↩ <span data-i="back"></span></button><button class="btn pink" id="bSolo">🚀 <span data-i="solo"></span></button><button class="btn" id="bCreate">▶ <span data-i="createbtn"></span></button></div>
</div></div>

</div></div>

 <h3 data-i="settings"></h3>

 <label><span data-i="vfx"></span><input type="checkbox" id="sv"></label>
